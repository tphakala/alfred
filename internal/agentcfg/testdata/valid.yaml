name: test-config
strategy: external_agent
runner: claude

schedule: { cron: "0 * * * *" }
concurrency: { max_concurrent: 1, on_conflict: skip }
budgets: { workflow_max_cost_usd: 5.0 }

prefilter:
  type: command
  command: "true"

phases:
  - name: main
    model: claude-sonnet-4-6
    prompt: { base: prompts/agents/test.md }
    steering: { mode: scheduled }
    output: { capture: text }
